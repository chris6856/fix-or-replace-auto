workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: fix_or_replace_asc
    environment:
      groups:
        - fix_or_replace_secrets
      vars:
        BUNDLE_ID: "com.fixorreplaceauto.app"
      node: 20.18.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install root workspace dependencies
        script: |
          npm ci
      - name: Build shared packages (types, calc-engine)
        script: |
          npm run build:packages
      - name: Run Expo prebuild (iOS)
        script: |
          cd app
          npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods dependencies
        script: |
          cd app/ios
          pod install
      - name: Set up keychain to be used for code signing
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "$IOS_CERTIFICATE_PRIVATE_KEY" \
            --create
      - name: Set up signing certificate
        script: |
          keychain add-certificates
      - name: Set up code signing on the Xcode project
        script: |
          # Restrict to the app's own .xcodeproj (maxdepth 1 excludes
          # ios/Pods/Pods.xcodeproj) -- this only assigns the fetched
          # certificate/profile to the project's build settings. The export
          # options plist itself is written separately below, since
          # use-profiles' own --custom-export-options validates "method"
          # against an enum that doesn't know Apple's "app-store-connect"
          # rename yet and throws on it.
          PROJECT=$(find "$CM_BUILD_DIR/app/ios" -maxdepth 1 -name "*.xcodeproj" | head -1)
          echo "Using project=$PROJECT"
          xcode-project use-profiles --project "$PROJECT" --verbose
      - name: Generate export options plist
        script: |
          PROFILE_PATH=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" | head -1)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin)
          TEAM_ID=$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /dev/stdin)
          echo "Using profile '$PROFILE_NAME' from team $TEAM_ID"

          EXPORT_PLIST="$HOME/custom_export_options.plist"
          plutil -create xml1 "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" "$EXPORT_PLIST"
      - name: Build ipa for distribution
        script: |
          # Derive both from the app's own .xcodeproj rather than parsing
          # `xcodebuild -list`'s scheme listing -- that listing also includes
          # every CocoaPods dependency's own shared scheme (e.g. "AppAuth"),
          # sorted alphabetically ahead of the app's own scheme name, so a
          # naive "first non-Pods line" pick grabbed a dependency instead of
          # the app.
          WORKSPACE=$(find "$CM_BUILD_DIR/app/ios" -maxdepth 1 -name "*.xcworkspace" | head -1)
          PROJECT=$(find "$CM_BUILD_DIR/app/ios" -maxdepth 1 -name "*.xcodeproj" | head -1)
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME" --export-options-plist "$HOME/custom_export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
