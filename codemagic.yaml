workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: fix_or_replace_asc
    environment:
      groups:
        - fix_or_replace_secrets
      vars:
        BUNDLE_ID: "com.fixorreplaceauto.app"
      node: 20.18.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install root workspace dependencies
        script: |
          npm ci
      - name: Build shared packages (types, calc-engine)
        script: |
          npm run build:packages
      - name: Run Expo prebuild (iOS)
        script: |
          cd app
          npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods dependencies
        script: |
          cd app/ios
          pod install
      - name: Set up keychain to be used for code signing
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "$IOS_CERTIFICATE_PRIVATE_KEY" \
            --create
      - name: Set up signing certificate
        script: |
          keychain add-certificates
      - name: Set up code signing on the Xcode project
        script: |
          # Restrict to the app's own .xcodeproj (maxdepth 1 excludes
          # ios/Pods/Pods.xcodeproj) -- letting use-profiles also touch the
          # Pods project alongside the custom export-options merge is what
          # was crashing this step with an unhandled exception.
          PROJECT=$(find "$CM_BUILD_DIR/app/ios" -maxdepth 1 -name "*.xcodeproj" | head -1)
          echo "Using project=$PROJECT"
          # Xcode's export options schema renamed the "app-store" method to
          # "app-store-connect" -- use-profiles still defaults to the old
          # name, which newer Xcode rejects outright during export.
          xcode-project use-profiles --project "$PROJECT" --custom-export-options '{"method": "app-store-connect"}' --verbose
      - name: Build ipa for distribution
        script: |
          WORKSPACE=$(find "$CM_BUILD_DIR/app/ios" -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1;next}/^[^ ]/{flag=0}flag' | sed 's/^ *//' | grep -v Pods | head -1)
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
