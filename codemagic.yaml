workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: fix_or_replace_asc
    environment:
      groups:
        - fix_or_replace_secrets
      vars:
        BUNDLE_ID: "com.fixorreplaceauto.app"
      node: 20.18.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install root workspace dependencies
        script: |
          npm ci
      - name: Build shared packages (types, calc-engine)
        script: |
          npm run build:packages
      - name: Run Expo prebuild (iOS)
        script: |
          cd app
          npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods dependencies
        script: |
          cd app/ios
          pod install
      - name: Set up keychain to be used for code signing
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "$IOS_CERTIFICATE_PRIVATE_KEY" \
            --create
      - name: Set up signing certificate
        script: |
          keychain add-certificates
      - name: Set up code signing on the Xcode project
        script: |
          # Restrict to the app's own .xcodeproj (maxdepth 1 excludes
          # ios/Pods/Pods.xcodeproj) -- this only assigns the fetched
          # certificate/profile to the project's build settings. The export
          # options plist itself is written separately below, since
          # use-profiles' own --custom-export-options validates "method"
          # against an enum that doesn't know Apple's "app-store-connect"
          # rename yet and throws on it.
          PROJECT=$(find "$CM_BUILD_DIR/app/ios" -maxdepth 1 -name "*.xcodeproj" | head -1)
          echo "Using project=$PROJECT"
          xcode-project use-profiles --project "$PROJECT" --verbose
      - name: Build ipa for distribution
        script: |
          # xcode-project build-ipa routes --export-options-plist through the
          # same ExportOptions model that rejects "app-store-connect" as an
          # unrecognized method (see the earlier ValueError from
          # use-profiles) -- it's not actually validating file syntax
          # despite the "is not a valid property list" wording, since
          # plutil -lint confirms the file itself is well-formed. Calling
          # xcodebuild directly for archive + export skips that broken
          # validation entirely; Apple's own tool is the one that actually
          # needs to accept this value, and it does.
          set -o pipefail
          # Derive both from the app's own .xcodeproj rather than parsing
          # `xcodebuild -list`'s scheme listing -- that listing also includes
          # every CocoaPods dependency's own shared scheme (e.g. "AppAuth"),
          # sorted alphabetically ahead of the app's own scheme name, so a
          # naive "first non-Pods line" pick grabbed a dependency instead of
          # the app.
          WORKSPACE=$(find "$CM_BUILD_DIR/app/ios" -maxdepth 1 -name "*.xcworkspace" | head -1)
          PROJECT=$(find "$CM_BUILD_DIR/app/ios" -maxdepth 1 -name "*.xcodeproj" | head -1)
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"

          # Read the team/profile/certificate straight out of the project's
          # own build settings instead of re-decoding the .mobileprovision
          # file -- use-profiles already resolved and applied these exact
          # values in the prior step, and independently re-deriving them via
          # security cms / PlistBuddy kept failing (it needs Apple's cert
          # chain in the keychain to verify the profile's signature, which
          # is not reliably available in a CI keychain).
          BUILD_SETTINGS=$(xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -showBuildSettings)
          TEAM_ID=$(echo "$BUILD_SETTINGS" | awk -F ' = ' '/ DEVELOPMENT_TEAM /{print $2; exit}')
          PROFILE_SPECIFIER=$(echo "$BUILD_SETTINGS" | awk -F ' = ' '/ PROVISIONING_PROFILE_SPECIFIER /{print $2; exit}')
          CERT_NAME=$(echo "$BUILD_SETTINGS" | awk -F ' = ' '/ CODE_SIGN_IDENTITY /{print $2; exit}')
          echo "Resolved team=$TEAM_ID profile=$PROFILE_SPECIFIER certificate=$CERT_NAME"

          EXPORT_PLIST="$HOME/custom_export_options.plist"
          # Write with Python's plistlib -- a single-line -c avoids a
          # heredoc's YAML-inherited indentation, which a multi-line Python
          # script (top-level statements must start at column 0) cannot
          # tolerate. Values are passed as argv, not interpolated into the
          # source.
          python3 -c 'import plistlib, sys; path, team_id, profile_name, cert_name, bundle_id = sys.argv[1:6]; open(path, "wb").write(plistlib.dumps({"method": "app-store-connect", "teamID": team_id, "signingStyle": "manual", "signingCertificate": cert_name, "provisioningProfiles": {bundle_id: profile_name}}))' "$EXPORT_PLIST" "$TEAM_ID" "$PROFILE_SPECIFIER" "$CERT_NAME" "$BUNDLE_ID"
          cat "$EXPORT_PLIST"

          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/$SCHEME.xcarchive"
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$IPA_DIR"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_DIR" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            | xcpretty
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
